# Local integration test; Railway uses its managed PostgreSQL service, NOT this Compose database.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawcare
      POSTGRES_PASSWORD: pawcare_local_only
      POSTGRES_DB: pawcare
    volumes:
      - pawcare_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawcare -d pawcare"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgresql://pawcare:pawcare_local_only@db:5432/pawcare
      NODE_ENV: development
      APP_ORIGIN: http://localhost:4000
      SESSION_COOKIE_SECURE: "false"
      PORT: "4000"
volumes:
  pawcare_pg_data:
