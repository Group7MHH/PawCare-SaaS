name: PawCare checks
on:
  push:
    branches: [main, refactor/single-store-three-roles]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install
      - run: npm run build
      - run: npm run test
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/pawcare_test
      - run: node --test tests/*.test.mjs
