name: PawCare checks
on:
  push:
    branches: [main, refactor/single-store-three-roles]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pawcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d pawcare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install
      - run: npm run build
      - run: npm run test
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/pawcare_test
      - run: node --test tests/*.test.mjs
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/postgres
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/pawcare_test
